external_components:
  - source: github://Aculeasis/myesphome
    components: [zigbee_batch]
    refresh: 0s

substitutions:
  name: "esp32-c6-zigbee-th"
  friendly_name: "ESP32-C6 Zigbee Temp & Humidity Sensor"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # Isolate the unpowered DHT22 as early as possible during startup.
    - priority: 900
      then:
        - lambda: |-
            gpio_pullup_dis(GPIO_NUM_3);
            gpio_pulldown_dis(GPIO_NUM_3);

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  cpu_frequency: 80MHz
  framework:
    type: esp-idf
    log_level: NONE
    advanced:
      assertion_level: SILENT

logger:
  baud_rate: 0
  level: NONE

safe_mode:
  disabled: true

# zigbee_batch synchronizes its persistent diagnostics explicitly. There are
# no restored globals/switches needing a periodic flash wake in this sketch.
preferences:
  flash_write_interval: never

# --------------------------------------------------------------------------
# Zigbee End Device Configuration (Native IEEE 802.15.4 Radio)
# --------------------------------------------------------------------------
zigbee:
  id: zb_stack
  router: false
  power_source: BATTERY
  model: "ptvo.switch"
  on_join:
    then:
      # Cancel a hold started before joining; it must not reset the device
      # during the coordinator interview.
      - script.stop: hold_timer_script
      - lambda: |-
          id(is_joined) = true;
          id(sleep_allowed) = false;
          if (id(regular_cycle_started_us) == 0)
            id(regular_cycle_started_us) = esp_timer_get_time();
          id(wakeup_reason) = 0;
      - script.stop: awake_safety_guard
      # Reserve an interview window only for a factory-new device.
      - if:
          condition:
            lambda: 'return x;'
          then:
            - script.execute: blink_joined
            - script.execute: finish_join
          else:
            # Resume immediately with saved credentials, including rejoin.
            - script.stop: finish_join
            - lambda: 'id(sleep_allowed) = true;'
            - if:
                condition:
                  not:
                    script.is_running: measurement_cycle
                then:
                  - script.execute: measurement_cycle

zigbee_batch:
  id: zb_batch
  zigbee_id: zb_stack

  endpoint: 1
  destination_endpoint: 1

  cluster_id: 0xFC01
  diagnostic_cluster_id: 0xFC02
  command_id: 0x00

  # Wire order. Each add()/skip() in measurement_cycle consumes one entry.
  data:
    - int16_t   # temperature * 100
    - uint16_t  # humidity * 100
    - uint16_t  # battery voltage * 1000
    - uint8_t   # battery percent
    - uint32_t  # uptime seconds
    - uint16_t  # previous TX wait, milliseconds

  # Consecutive transient failures before a controlled MCU restart.
  noncritical_error_limit: 5
  wakeup_pin: 9

# --------------------------------------------------------------------------
# Global Variables
# --------------------------------------------------------------------------
globals:
  # Set only by on_join in the current boot. It is intentionally not restored.
  - id: is_joined
    type: bool
    restore_value: no
    initial_value: 'false'
  # Enables the explicit 10-minute light-sleep cycle after the post-join
  # awake window.
  - id: sleep_allowed
    type: bool
    restore_value: no
    initial_value: 'false'

  # Start of the current regular 10-minute period. Button measurements do not
  # change it, so their duration cannot shift the regular reporting schedule.
  - id: regular_cycle_started_us
    type: int64_t
    restore_value: no
    initial_value: '0'

  # Result of sleep: 0=regular deadline, 1=debounced release, 2=restart.
  - id: wakeup_reason
    type: int
    restore_value: no
    initial_value: '0'

  # A short button press requests one measurement without resetting the
  # regular 10-minute deadline.
  - id: button_measurement_request
    type: bool
    restore_value: no
    initial_value: 'false'
  # Actual time spent by the previous measurement cycle waiting for
  # zb_batch.is_idle(). This value is inserted into the next packet.
  - id: zb_last_wait_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # First packet after boot must not claim that previous latency=0ms.
  - id: zb_last_wait_valid
    type: bool
    restore_value: no
    initial_value: 'false'

  # Start timestamp used only while waiting for the current batch TX.
  - id: zb_wait_started_us
    type: int64_t
    restore_value: no
    initial_value: '0'

  # Result of the current send() queue operation.
  - id: zb_send_queued
    type: bool
    restore_value: no
    initial_value: 'false'


# --------------------------------------------------------------------------
# Internal emergency restart button (safety fallback only)
# --------------------------------------------------------------------------
button:
  - platform: restart
    id: emergency_restart
    name: None
    internal: true

# --------------------------------------------------------------------------
# Internal Switches (Status LED, DHT22 Switched Power, Voltage Divider GND Key)
# --------------------------------------------------------------------------
switch:
  # Onboard blue LED (GPIO15, internal to hide from Zigbee exposes)
  - platform: gpio
    pin:
      number: GPIO15
      ignore_strapping_warning: true
    id: status_led
    internal: true
    restore_mode: ALWAYS_OFF

  # Switched power supply for DHT22 (GPIO2)
  - platform: gpio
    pin: GPIO2
    id: dht_power_switch
    internal: true
    restore_mode: ALWAYS_OFF

  # Switched ground key for battery voltage divider (GPIO19)
  - platform: gpio
    pin:
      number: GPIO19
      mode:
        output: true
        open_drain: true
      inverted: true
    id: vbat_gnd_switch
    internal: true
    restore_mode: ALWAYS_OFF

# --------------------------------------------------------------------------
# Button (GPIO9 / BOOT -> GND)
#
# The GPIO interrupt wakes the ESPHome loop from automatic light sleep. A short
# press starts a measurement; an 8-second hold performs a factory reset.
# --------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
      ignore_strapping_warning: true
    id: action_button
    internal: true
    # zigbee_batch owns the one-shot wake interrupt; this sensor only reads the
    # state after that interrupt wakes the ESPHome loop.
    use_interrupt: false
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      then:
        - script.execute: hold_timer_script
    on_release:
      then:
        - if:
            condition:
              script.is_running: hold_timer_script
            then:
              - script.stop: hold_timer_script
              - if:
                  condition:
                    lambda: |-
                      return id(is_joined) && id(sleep_allowed) &&
                             (id(sleep_cycle).is_running() ||
                              !id(measurement_cycle).is_running());
                  then:
                    - lambda: |-
                        id(button_measurement_request) = true;
                        id(wakeup_reason) = 0;
                    - if:
                        condition:
                          not:
                            script.is_running: measurement_cycle
                        then:
                          - script.execute: measurement_cycle

# --------------------------------------------------------------------------
# Scripts for LED Indications and Measurement Sequence
# --------------------------------------------------------------------------
script:
  # For a factory-new join, keep the radio available while the button is held
  # and for 30 seconds after release so the coordinator can interview it.
  - id: finish_join
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: 'return gpio_get_level(GPIO_NUM_9) == 1;'
      - delay: 30s
      - lambda: 'id(sleep_allowed) = true;'
      - if:
          condition:
            not:
              script.is_running: measurement_cycle
          then:
            - script.execute: measurement_cycle

  # 8-Second Hold Timer: Available both before and after joining.
  - id: hold_timer_script
    mode: restart
    then:
      - delay: 8s
      - if:
          condition:
            lambda: 'return gpio_get_level(GPIO_NUM_9) == 0;'
          then:
            - script.execute: reset_after_release

  # Perform the reboot only after BOOT is released, and only once per hold.
  - id: reset_after_release
    mode: single
    then:
      - lambda: |-
          id(is_joined) = false;
          id(sleep_allowed) = false;
          id(button_measurement_request) = false;
      - script.stop: finish_join
      - script.stop: awake_safety_guard
      - script.stop: measurement_cycle
      - script.stop: sleep_cycle
      - lambda: 'id(zb_batch).stop_sleep();'
      - script.execute: blink_pairing
      - wait_until:
          condition:
            lambda: 'return gpio_get_level(GPIO_NUM_9) == 1;'
      - delay: 30ms
      - script.wait: blink_pairing
      - zigbee.factory_reset

  # Pairing indicator: 5 fast blinks (100ms on / 100ms off)
  - id: blink_pairing
    then:
      - repeat:
          count: 5
          then:
            - switch.turn_on: status_led
            - delay: 100ms
            - switch.turn_off: status_led
            - delay: 100ms

  # Network joined indicator: 1 long blink (1000ms)
  - id: blink_joined
    then:
      - switch.turn_on: status_led
      - delay: 1000ms
      - switch.turn_off: status_led

  # Emergency guard for the active measurement state machine. A stalled active
  # cycle restarts the MCU after 120 seconds.
  - id: awake_safety_guard
    mode: restart
    then:
      - delay: 120s
      - lambda: 'id(zb_batch).prepare_restart(60010);'
      - button.press: emergency_restart

  # Keep one sleep operation alive through raw GPIO pulses and Zigbee events.
  # The component sleeps between actual deadlines and yields to ESPHome after
  # each wake. Only a debounced short press requests an extra measurement.
  - id: sleep_cycle
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(is_joined) && id(sleep_allowed);'
          then:
            - script.stop: awake_safety_guard
            - lambda: |-
                constexpr int64_t period_us = 600LL * 1000000LL;
                const int64_t deadline_us =
                    id(regular_cycle_started_us) + period_us;
                id(zb_batch).start_sleep(deadline_us);
            - wait_until:
                condition:
                  lambda: |-
                    return id(button_measurement_request) ||
                           id(zb_batch).sleep_finished();
            - lambda: |-
                id(zb_batch).stop_sleep();
                id(wakeup_reason) = id(zb_batch).restart_required() ? 2 :
                    (id(button_measurement_request) ? 1 : 0);
                if (id(wakeup_reason) == 0)
                  id(regular_cycle_started_us) = esp_timer_get_time();
            - if:
                condition:
                  lambda: 'return id(wakeup_reason) == 2;'
                then:
                  - lambda: 'id(zb_batch).prepare_restart(0);'
                  - button.press: emergency_restart

  # Single owner of regular measurements and the event-driven automatic sleep
  # between them. Filtered-out pulses leave this script alive; a debounced
  # release starts one button measurement and preserves the old deadline.
  - id: measurement_cycle
    mode: single
    then:
      - while:
          condition:
            lambda: |-
              return id(is_joined) && id(sleep_allowed) &&
                     id(wakeup_reason) != 2;
          then:
            - if:
                condition:
                  lambda: 'return id(zb_batch).consume_restart_cooldown();'
                then:
                  - lambda: |-
                      if (id(regular_cycle_started_us) == 0)
                        id(regular_cycle_started_us) = esp_timer_get_time();
                  - script.execute: sleep_cycle
                  - script.wait: sleep_cycle
                  - if:
                      condition:
                        lambda: 'return id(wakeup_reason) == 2;'
                      then:
                        - script.stop: measurement_cycle

            - script.execute: awake_safety_guard
            - if:
                condition:
                  lambda: 'return id(button_measurement_request);'
                then:
                  - lambda: 'id(button_measurement_request) = false;'
                else:
                  - lambda: |-
                      if (id(regular_cycle_started_us) == 0)
                        id(regular_cycle_started_us) = esp_timer_get_time();

            - lambda: 'gpio_pullup_en(GPIO_NUM_3);'
            - switch.turn_on: dht_power_switch
            - switch.turn_on: vbat_gnd_switch

            # Preserve the existing power-saving DHT22 warmup.
            - lambda: |-
                gpio_hold_en(GPIO_NUM_2);
                gpio_hold_en(GPIO_NUM_19);
                // A button must not shorten the sensor's required warmup sleep.
                id(zb_batch).suspend_button_wakeup();
                id(zb_batch).wait_for_duration(2000);
                id(zb_batch).resume_button_wakeup();
                gpio_hold_dis(GPIO_NUM_2);
                gpio_hold_dis(GPIO_NUM_19);

            - component.update: dht_sensor
            - component.update: battery_voltage
            - component.update: uptime_sensor
            - switch.turn_off: dht_power_switch
            - switch.turn_off: vbat_gnd_switch
            - lambda: |-
                gpio_pullup_dis(GPIO_NUM_3);
                gpio_pulldown_dis(GPIO_NUM_3);

            - switch.turn_on: status_led
            - lambda: |-
                id(zb_batch).begin();
                id(zb_batch).add(id(temperature).state * 100.0f);
                id(zb_batch).add(id(humidity).state * 100.0f);
                id(zb_batch).add(id(battery_voltage).state * 1000.0f);
                id(zb_batch).add(id(battery_level).state);
                // Read integer uptime before it can lose precision in a sensor float.
                id(zb_batch).add(static_cast<uint32_t>(
                    esp_timer_get_time() / 1000000LL));
                if (id(zb_last_wait_valid)) {
                  id(zb_batch).add(id(zb_last_wait_ms));
                } else {
                  id(zb_batch).skip();
                }
                id(zb_send_queued) = id(zb_batch).send();
                if (id(zb_send_queued))
                  id(zb_wait_started_us) = esp_timer_get_time();

            - if:
                condition:
                  lambda: 'return id(zb_send_queued);'
                then:
                  # Separate 3s packet deadlines, with automatic Light Sleep
                  # while waiting for data and (when present) diagnostics.
                  - switch.turn_off: status_led
                  - lambda: 'id(zb_batch).start_tx_wait();'
                  - wait_until:
                      condition:
                        lambda: 'return id(zb_batch).is_idle();'
                  - lambda: |-
                      id(zb_batch).stop_sleep();
                      const int64_t elapsed_us =
                          esp_timer_get_time() - id(zb_wait_started_us);
                      uint32_t elapsed_ms = static_cast<uint32_t>(
                          (elapsed_us + 999LL) / 1000LL);
                      id(zb_last_wait_ms) =
                          elapsed_ms > 65535U ? 65535U : elapsed_ms;
                      id(zb_last_wait_valid) = true;
                  - lambda: 'id(zb_batch).finish_tx();'
                else:
                  - lambda: 'id(zb_last_wait_valid) = false;'

            - switch.turn_off: status_led
            - script.stop: awake_safety_guard
            - if:
                condition:
                  lambda: 'return id(zb_batch).restart_required();'
                then:
                  - lambda: 'id(zb_batch).prepare_restart(0);'
                  - button.press: emergency_restart

            - script.execute: sleep_cycle
            - script.wait: sleep_cycle

# --------------------------------------------------------------------------
# Sensors (Mapped to Zigbee Clusters)
# --------------------------------------------------------------------------
sensor:
  - platform: dht
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: false
    model: DHT22
    temperature:
      name: "Temperature"
      id: temperature
      internal: true
      filters:
        - round: 1
    humidity:
      name: "Humidity"
      id: humidity
      internal: true
      filters:
        - round: 1
    update_interval: never
    id: dht_sensor
  - platform: adc
    pin: GPIO0
    id: battery_voltage
    name: "Battery Voltage"
    internal: true
    entity_category: "diagnostic"
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    accuracy_decimals: 2
    attenuation: 6db
    update_interval: never
    filters:
      # Multiplier: 3.22848
      # Calibrated multiplier: 3.2228
      - multiply: 3.2228
      - round: 2
  - platform: copy
    source_id: battery_voltage
    id: battery_level
    name: "Battery Level"
    internal: true
    entity_category: "diagnostic"
    unit_of_measurement: "%"
    device_class: "battery"
    state_class: "measurement"
    accuracy_decimals: 0
    filters:
      # Li-Ion 18650 1S discharge curve calibration
      - calibrate_linear:
          method: exact
          datapoints:
            - 3.10 -> 0.0
            - 3.50 -> 25.0
            - 3.65 -> 37.5
            - 3.75 -> 58.3
            - 3.85 -> 79.2
            - 4.00 -> 91.7
            - 4.17 -> 100.0
      - clamp:
          min_value: 0.0
          max_value: 100.0
      - round: 0
  - platform: uptime
    id: uptime_sensor
    name: "Uptime"
    internal: true
    entity_category: "diagnostic"
    unit_of_measurement: "s"
    device_class: "duration"
    state_class: "total_increasing"
    accuracy_decimals: 0
    update_interval: never
    filters:
      - round: 0
